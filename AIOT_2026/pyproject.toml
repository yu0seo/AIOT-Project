[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-eye-idd"
version = "0.1.0"
description = "IDD 좌표 기반 음주 조건 시계열 분류 연구"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "torch>=2.6,<3"]

[project.scripts]
road-eye-idd = "idd_classifier.cli:main"

[tool.setuptools.packages.find]
include = ["idd_classifier*"]
